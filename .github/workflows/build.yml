name: Build FortniteChestTracker.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sign the exe and write the release notes without publishing anything (checks the release job)'
        type: boolean
        default: false

# Read-only by default. Only the release job (tags) can write to the repository, and it runs no third-party code:
# it signs the exe with the release key (secret UPDATE_SIGNING_KEY, the apps refuse updates without that signature)
# and publishes it with the GitHub CLI. Actions are pinned to a commit (a moved tag cannot change what runs).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test FortniteChestTracker.slnx -c Release
      # The exe updates itself from the releases of the repository it was built in (fork-safe).
      - name: Publish
        run: dotnet publish src/FortniteChestTracker/FortniteChestTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:TrackerRepo=${{ github.repository }} -o dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FortniteChestTracker
          path: dist/FortniteChestTracker.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (only CHANGELOG.md, for the release notes)
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FortniteChestTracker
          path: dist
      - name: Sign the exe
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # the public key embedded in the app (Updater.ReleaseKey): the signature is checked before publishing
          RELEASE_PUBLIC_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEkdN5a2OULwXBp2DEaOpZwPWBRSYDMKoU96WwMvZItWYrBdZV+Ft61EZY4veXWAOUtXPYZOGp3uBsq/MxZ1bSJQ==
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::secret UPDATE_SIGNING_KEY missing: the release cannot be signed"; exit 1; }
          umask 077
          printf '%s' "$UPDATE_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/key.der"
          openssl dgst -sha256 -keyform DER -sign "$RUNNER_TEMP/key.der" -out "$RUNNER_TEMP/sig.der" dist/FortniteChestTracker.exe
          rm -f "$RUNNER_TEMP/key.der"
          printf '%s' "$RELEASE_PUBLIC_KEY" | base64 -d > "$RUNNER_TEMP/pub.der"
          openssl dgst -sha256 -keyform DER -verify "$RUNNER_TEMP/pub.der" -signature "$RUNNER_TEMP/sig.der" dist/FortniteChestTracker.exe
          base64 -w0 "$RUNNER_TEMP/sig.der" > dist/FortniteChestTracker.exe.sig
      - name: Release notes (the CHANGELOG section of the version)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tr -d '\r' < CHANGELOG.md | awk -v v="$version" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {f=0} f' > "$RUNNER_TEMP/section.md"
          {
            echo '**Download `FortniteChestTracker.exe` below** (Windows 10 / 11, one file). Windows may say "Windows protected your PC" because the exe has no paid code-signing certificate: More info → Run anyway.'
            echo
            echo 'Already installed? It updates itself (the update is checked with the signature `FortniteChestTracker.exe.sig`).'
            echo
            cat "$RUNNER_TEMP/section.md"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/FortniteChestTracker.exe dist/FortniteChestTracker.exe.sig --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/FortniteChestTracker.exe dist/FortniteChestTracker.exe.sig --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Fortnite - Chest Tracker ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
