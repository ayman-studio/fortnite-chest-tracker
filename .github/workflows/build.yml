name: Build FortniteChestTracker.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test FortniteChestTracker.slnx -c Release
      # The exe updates itself from the releases of the repository it was built in (fork-safe).
      - name: Publish
        run: dotnet publish src/FortniteChestTracker/FortniteChestTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:TrackerRepo=${{ github.repository }} -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: FortniteChestTracker
          path: dist/FortniteChestTracker.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FortniteChestTracker.exe
